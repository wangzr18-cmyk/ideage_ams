<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="reimburse">
    <!-- Content Header (Page header) -->
    <div class="content-header">
        <div class="container-fluid">
            <div class="row mb-2">
                <div class="col-sm-6">
                    <h1 class="m-0 text-dark">精算申请一覧</h1>
                </div><!-- /.col -->
                <div class="col-sm-6">
                    <ol class="breadcrumb float-sm-right">
                        <li class="breadcrumb-item"><a th:href="@{/default}">ホームページ</a></li>
                        <li class="breadcrumb-item active">精算申请一覧</li>
                    </ol>
                </div><!-- /.col -->
            </div><!-- /.row -->
        </div><!-- /.container-fluid -->
    </div>

    <!-- Search Panel -->
    <div class="content">
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-body p-2">
                        <div class="d-flex align-items-center">
                            <div class="d-flex align-items-center mr-3">
                                <label class="mb-0 mr-2">開始年月</label>
                                <input type="month" class="form-control form-control-sm" id="startMonth" value="2024-04" style="width: 140px;">
                            </div>
                            <div class="d-flex align-items-center mr-3">
                                <label class="mb-0 mr-2">終了年月</label>
                                <input type="month" class="form-control form-control-sm" id="endMonth" value="2024-06" style="width: 140px;">
                            </div>
                            <div class="d-flex align-items-center mr-3">
                                <label class="mb-0 mr-2">部門</label>
                                <select class="form-control form-control-sm" id="department" style="width: 120px;">
                                    <option value="">全て</option>
                                    <option value="営業一部">営業一部</option>
                                    <option value="営業二部">営業二部</option>
                                </select>
                            </div>
                            <div class="d-flex align-items-center mr-3">
                                <label class="mb-0 mr-2">社員番号</label>
                                <input type="text" class="form-control form-control-sm" id="employeeId" style="width: 80px;">
                            </div>
                            <div class="d-flex align-items-center mr-3">
                                <label class="mb-0 mr-2">名前</label>
                                <input type="text" class="form-control form-control-sm" id="employeeName" style="width: 120px;">
                            </div>

                            <button type="button" class="btn btn-info btn-sm" onclick="searchReimburseList()">
                                <i class="fa fa-search"></i> 検索
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Main content -->
    <div class="content">
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <div class="grid-btn">
                            <button class="btn btn-info" onclick="expenseAdd()"><i
                                    class="fa fa-plus"></i>&nbsp;追加
                            </button>
                            <button class="btn btn-info" onclick="expenseExport()"><i
                                    class="fa fa-print"></i>&nbsp;出力
                            </button>
                            <button class="btn btn-danger" onclick="deleteExpense()"><i
                                    class="fa fa-trash-o"></i>&nbsp;削除
                            </button>

                            <!-- CSRF 隐藏字段 -->
                            <meta name="_csrf" content="${_csrf.token}"/>
                            <meta name="_csrf_header" content="${_csrf.headerName}"/>

                        </div>
                        <table id="jqGrid" class="table table-bordered">
                        </table>
                        <div id="jqGridPager"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="content">
        <div class="modal fade" id="attendanceModal" tabindex="-1" role="dialog" aria-labelledby="attendanceModalLabel">
            <div class="modal-dialog" role="document">
                <div class="modal-content" style="width: 800px;height: 880px;">
                    <div class="modal-header">
                        <button type="button" class="close" data-dismiss="modal" aria-label="Close" on><span
                                aria-hidden="true">&times;</span></button>
                        <h6 class="modal-title" id="attendanceModalLabel">編集</h6>
                    </div>
                    <div class="modal-body">
                        <form>
                            <div class="form-group">
                                <div class="alert alert-danger">エラー表示欄</div>
                            </div>
                            <input type="hidden" id="attendanceId" value="1">

                            <div class="form-group">
                                <label for="attendanceName" class="control-label">タイトル:</label>
                                <input type="text" class="form-control" style="width: 70%" id="attendanceName">
                            </div>
                            <div class="form-group">
                                <label for="attendanceAuthor" class="control-label">入力者:</label>
                                <input type="text" class="form-control" style="width: 70%" id="attendanceAuthor">
                            </div>
                            <div class="form-group">
                                <label class="control-label">入力内容:</label>
                                <div id="wangEditor"></div>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-default" data-dismiss="modal">取消</button>
                        <button type="button" class="btn btn-primary" id="saveButton">保存</button>
                    </div>
                </div>
            </div>
        </div>
		
		
		<div id="modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5);">
		  <div style="background:#fff; width:500px; margin:100px auto; padding:20px;">
		    
		    <!-- Step 1 -->
		    <div id="step1">
		      <h3>主表信息</h3>

		      <input id="name" placeholder="社员ID">
		      <input id="user" placeholder="报销人">
		      <input id="date" placeholder="部门">
		      <input id="desc" placeholder="备注">

		      <button onclick="nextStep()">下一步</button>
		    </div>

		    <!-- Step 2 -->
		    <div id="step2" style="display:none;">
		      <h3>明细</h3>

		      <div id="details"></div>

		      <button onclick="addDetail()">+ 添加明细</button>
		      <button onclick="submit()">完成</button>
		    </div>

		  </div>
		</div>
        <!-- /.modal -->
    </div>
    <!-- jQuery -->
    <script src="plugins/jquery/jquery.min.js"></script>
    <!-- jQuery UI 1.11.4 -->
    <script src="plugins/jQueryUI/jquery-ui.min.js"></script>
    <!-- Bootstrap 4 -->
    <script src="plugins/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/wangeditor@latest/dist/wangEditor.min.js"></script>
    <script src="plugins/jqgrid-5.7.0/grid.locale-ja.js"></script>
    <!-- sweet alert -->
    <script src="plugins/sweetalert/sweetalert.min.js"></script>
    <script src="plugins/jqgrid-5.7.0/jquery.jqGrid.min.js"></script>
    <script type="text/javascript" src="dist/js/TrxExpenseRequest.js"></script>
</div>
</body>
</html>
