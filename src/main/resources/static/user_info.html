        <div class="d-flex justify-content-center align-items-start" style="min-height: 100vh; background-color: #f4f6f9;">
            <div class="rounded p-4" style="flex: 1; min-width: 600px; max-width: 1500px; margin: 10px; background-color: #fff; border: 1px solid #ccc; box-shadow: 0 0 10px rgba(0,0,0,0.1); border-radius: 5px;">
                <form id="userForm">
                    <h2 class="text-center mb-4">ユーザー情報</h2>
                    <div class="d-flex justify-content-center">
                        <div style="width: 600px;">
                            <div class="form-group mb-2" style="display: flex; align-items: center;">
                                <label for="empId" style="width: 100px;">社員番号</label>
                                <input type="text" class="form-control uniform-height" id="empId" name="empId" style="width: 200px;">
                            </div>
                            <div class="form-group mb-2" style="display: flex; align-items: center;">
                                <label for="empName" style="width: 100px;">名前</label>
                                <input type="text" class="form-control uniform-height" id="empName" name="empName" style="width: 200px;">
                            </div>
                            <div class="form-group mb-2" style="display: flex; align-items: center;">
                                <label for="phone" style="width: 100px;">電話番号</label>
                                <input type="tel" class="form-control uniform-height" id="phone" name="phone" style="width: 200px;">
                            </div>
                            <div class="form-group mb-2" style="display: flex; align-items: center;">
                                <label for="email" style="width: 100px;">メール</label>
                                <input type="email" class="form-control uniform-height" id="email" name="email" style="width: 200px;">
                            </div>
                            <div class="form-group mb-2" style="display: flex; align-items: center;">
                                <label for="empStatus" style="width: 100px;">状態</label>
                                <input type="text" class="form-control uniform-height" id="empStatus" name="empStatus"  style="width: 200px;">
                            </div>
                            <div class="form-group mb-2" style="display: flex; align-items: center;">
                                <label for="joinDate" style="width: 100px;">入社日</label>
                                <input type="date" class="form-control uniform-height" id="joinDate" name="joinDate" style="width: 200px;">
                            </div>
                            <div class="form-group mb-2" style="display: flex; align-items: center;">
                                <label for="permission" style="width: 100px;">システム権限</label>
                                <input type="text" class="form-control uniform-height" id="permission" name="permission" style="width: 200px;">
                            </div>
                            <div style="display: flex; width: 100%; margin-bottom: 10px;">
                                <div style="flex: 1; display: flex; flex-direction: column; gap: 10px;">
                                    <div style="display: flex; align-items: center;">
                                        <label for="department1" style="width: 100px;">組織1</label>
                                        <input type="text" class="form-control uniform-height" id="department1" name="department1" style="width: 200px;">
                                    </div>
                                    <div style="display: flex; align-items: center;">
                                        <label for="department2" style="width: 100px;">組織2</label>
                                        <input type="text" class="form-control uniform-height" id="department2" name="department2" style="width: 200px;">
                                    </div>
                                    <div style="display: flex; align-items: center;">
                                        <label for="department3" style="width: 100px;">組織3</label>
                                        <input type="text" class="form-control uniform-height" id="department3" name="department3" style="width: 200px;">
                                    </div>
                                </div>
                                <div style="flex: 1; display: flex; flex-direction: column; gap: 10px; margin-left: 5px;">
                                    <div style="display: flex; align-items: center;">
                                        <label for="position1" style="width: 100px; text-align: right; margin-right: 40px;">役職1</label>
                                        <input type="text" class="form-control uniform-height" id="position1" name="position1" style="width: 200px;">
                                    </div>
                                    <div style="display: flex; align-items: center;">
                                        <label for="position2" style="width: 100px; text-align: right; margin-right: 40px;">役職2</label>
                                        <input type="text" class="form-control uniform-height" id="position2" name="position2" style="width: 200px;">
                                    </div>
                                    <div style="display: flex; align-items: center;">
                                        <label for="position3" style="width: 100px; text-align: right; margin-right: 40px;">役職3</label>
                                        <input type="text" class="form-control uniform-height" id="position3" name="position3" style="width: 200px;">
                                    </div>
                                </div>
                            </div>
                            <div class="mb-2" style="display: flex; align-items: center; margin-top: 10px; width: 950px;">
                                <label for="address" style="width: 100px;">住所</label>
                                <input type="text" class="form-control uniform-height" id="address" name="address" style="width: 550px; min-width: 0; padding: .25rem .5rem;">

                            <div class="mb-2" style="display: flex; align-items: center; width: 950px;">

                        <div style="width: 200px; flex-shrink: 0; margin-left: -150px;">

                                <img id="previewImage" src="" alt="Profile Preview"
                                     style="display:none; max-width:100%; max-height:100%; object-fit:contain;">
                            </div>
                            <input type="file" id="profileImage" name="profileImage" accept="image/*" style="display:none;">
                            <button type="button" class="btn btn-primary btn-sm mt-2"
                                    style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 6px;"

                            </button>
                        </div>

<script>
    $(function() {
        $('#profileImage').on('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                $('#previewImage').attr('src', event.target.result).show();
                $('#defaultIcon').hide();
            };
            reader.readAsDataURL(file);
        });
    });
</script>
